{% load wagtailcore_tags wagtailimages_tags %}

<section class="project-item" style="margin-bottom: 2em; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; overflow: hidden; background: rgba(255, 255, 255, 0.05); transition: all 0.3s ease;">
    <div class="project-summary" style="padding: 1.5em; cursor: pointer; display: flex; gap: 20px; align-items: flex-start;" 
         data-page-id="{{ page.id }}"
         onmouseover="this.parentElement.style.background='rgba(255, 255, 255, 0.08)'" 
         onmouseout="this.parentElement.style.background='rgba(255, 255, 255, 0.05)'">
        
        <div class="project-info" style="flex: 1;">
            <h3 class="major" style="margin-bottom: 0.5em; border-bottom: none; padding-bottom: 0;">{{ page.title }}</h3>
            
            {% if page.short_description %}
                <p class="project-short-description" style="margin-bottom: 0; color: rgba(255, 255, 255, 0.7); line-height: 1.5;">
                    {{ page.short_description|truncatechars:150 }}
                </p>
            {% endif %}
        </div>

        {% if page.preview %}
            <div class="project-preview-wrapper" style="flex: 0 0 150px; width: 150px; height: 100px; overflow: hidden; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.1);">
                {% image page.preview fill-300x200 as preview_img %}
                <img src="{{ preview_img.url }}" alt="{{ preview_img.alt }}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
            </div>
        {% endif %}
    </div>
</section>
<hr style="margin: 2em 0;" />
