[project]
name = "personalpage"
version = "0.1.0"
description = "A personal page built with Django using the Dimension template"
requires-python = ">=3.10"
dependencies = [
    "django (==5.2.15)",
    "wagtail (==7.4.1)",
    "pillow (==12.2.0)",
    "anyascii (==0.3.3)",
    "asgiref (==3.11.1)",
    "beautifulsoup4 (==4.15.0)",
    "certifi (==2026.5.20)",
    "charset-normalizer (==3.4.7)",
    "defusedxml (==0.7.1)",
    "django-filter (==25.2)",
    "django-modelcluster (==6.5)",
    "django-permissionedforms (==0.1)",
    "django-stubs-ext (==6.0.5)",
    "django-taggit (==6.1.0)",
    "django-tasks (==0.12.0)",
    "django-treebeard (==5.2.2)",
    "djangorestframework (==3.17.1)",
    "draftjs-exporter (==5.2.0)",
    "et-xmlfile (==2.0.0)",
    "filetype (==1.2.0)",
    "idna (==3.18)",
    "laces (==0.1.2)",
    "modelsearch (==1.3.1)",
    "openpyxl (==3.1.5)",
    "pillow-heif (==1.4.0)",
    "python-dotenv (==1.2.2)",
    "requests (==2.34.2)",
    "soupsieve (==2.8.4)",
    "sqlparse (==0.5.5)",
    "telepath (==0.3.1)",
    "typing-extensions (==4.15.0)",
    "tzdata (==2026.2)",
    "urllib3 (==2.7.0)",
    "willow (==1.12.0)",
]

[tool.setuptools]
packages = ["personalpage"]
